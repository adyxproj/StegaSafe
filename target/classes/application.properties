spring.application.name=stegasafe
server.port=8080

# Multipart Upload Limits (e.g. up to 50MB images)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Thymeleaf caching disabled for hot-reload during development
spring.thymeleaf.cache=false

# Logging configuration
logging.level.com.stegasafe=INFO
logging.level.org.springframework.web=INFO
